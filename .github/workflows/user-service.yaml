name: User Service

on:
  push:
    branches:
      - main
    paths:
      - "services/user-service/**"
      - ".github/workflows/user-service.yaml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U developer -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Create .env
        working-directory: services/user-service
        run: |
          cat <<EOF > .env
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=developer
          DB_PASSWORD=supersecretpassword
          DB_NAME=ecommerce
          DB_SSLMODE=disable
          EOF

      - name: Run Goose migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "host=localhost port=5432 user=developer password=supersecretpassword dbname=ecommerce sslmode=disable"
        run: goose -dir services/user-service/migrations up

      - name: Run tests
        working-directory: services/user-service
        run: go test -v ./...
  
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build image service
        working-directory: services/user-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-user-service:v1.0 .

      - name: Push image service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-user-service:v1.0 

      - name: Build image migrations
        working-directory: services/user-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-user-service-migrations:v1.0 -f Dockerfile.migrate .

      - name: Push image migrations
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-user-service-migrations:v1.0 